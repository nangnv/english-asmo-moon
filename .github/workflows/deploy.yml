name: Deploy to Cloudflare
# Runs after a merge to main (for example the weekly question-bank PR). Needs two repository secrets:
# CLOUDFLARE_API_TOKEN (Workers Scripts + D1 edit) and CLOUDFLARE_ACCOUNT_ID. See docs/DEPLOY_CLOUDFLARE.md.
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deploy
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Check generated Worker is current
        run: git diff --exit-code -- worker/index.js
      - name: Stop if Cloudflare secrets are missing
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID in Settings → Secrets and variables → Actions."
            exit 1
          fi
      - name: Apply database migrations
        run: npx --yes wrangler@4 d1 migrations apply asmo-english --remote
      - name: Deploy
        run: npx --yes wrangler@4 deploy
