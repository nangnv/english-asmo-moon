# Cloudflare Workers deployment. See docs/DEPLOY_CLOUDFLARE.md.
# Secrets (STUDENT_PASSWORD, PARENT_PASSWORD, OPENAI_API_KEY, RESEND_API_KEY, REPORT_EMAIL) are set with `wrangler secret put`, never here.
name = "asmo-english"
main = "worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
AUTH_MODE = "password"
OPENAI_MODEL = "gpt-4.1-mini"

[[d1_databases]]
binding = "DB"
database_name = "asmo-english"
database_id = "e200ff66-5fa9-4414-a686-371c417c8dbe"
migrations_dir = "migrations"

[observability]
enabled = true
